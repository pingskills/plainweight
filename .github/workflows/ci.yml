name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-declarative appstream desktop-file-utils
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Desktop metadata
        run: |
          desktop-file-validate packaging/io.github.pingskills.plainweight.desktop
          appstreamcli validate --no-net packaging/io.github.pingskills.plainweight.metainfo.xml
      - name: Staged installation
        run: DESTDIR="$PWD/stage" cmake --install build --prefix /usr
